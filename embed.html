<script>
  // Helper: read a query parameter from the URL
  function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
  }

  // Listen for NGX embed ready
  NGX.api('event:listen', 'embed:api:ready', (event) => {

      // Get customerid from URL
      const customerId = getQueryParam('customerid');

      // Only set it if it exists
      if (customerId) {
          NGX.api('form:set:customerid', customerId);
          console.log("Customer ID sent to NGX:", customerId);
      } else {
          console.warn("No customerid found in URL");
      }
  });
</script>
