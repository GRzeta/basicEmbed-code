<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Grow Embed Test Page</title>

  <link rel="stylesheet" href="style.css">
  <!-- GA IMPLEMENTATION -->
  <!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-QWDNH5F5GV"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

  gtag('config', 'G-QWDNH5F5GV');
</script>

  <!-- NGX Embed Script -->
  <script src="https://x.wayin.com/ui/ngx.embed.min.js"></script>

  <script>
    function getQueryParam(param) {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get(param);
    }

    NGX.api('event:listen', 'embed:api:ready', () => {
      const customerId = getQueryParam('customerid');
      if (customerId) {
        NGX.api('form:set:customerid', customerId);
        console.log("Customer ID sent to NGX:", customerId);
      }
    });
  </script>
</head>

<body>

  <!-- Banner -->
  <header class="banner">
    <div class="banner-content">
      <h1>Grow Test Embed Page</h1>
      <p>A simple test page showcasing a Grow embedded experience.</p>
    </div>
  </header>

  <!-- Intro Text -->
  <section class="content-block">
    <p>
      Introduction text.
    </p>
  </section>

  <!-- Embed -->
  <section class="content-block">
    <iframe
      src="https://x.wayin.com/display/container/dc/a2c08955-56a9-4405-8e49-0c22b7a0d202?mode=adaptive&scrolling=no"
      frameborder="0"
      scrolling="no"
      width="100%"
      height="600"
      id="ngxFramea2c08955-56a9-4405-8e49-0c22b7a0d202"
      allowtransparency="true">
    </iframe>
  </section>

</body>
</html>
