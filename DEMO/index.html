<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grow SSO test</title>

    <link rel="stylesheet" href="style.css" />
    <script src="https://x.wayin.com/ui/ngx.embed.min.js"></script>
  </head>

  <body>
    <header class="banner">
      <div class="banner-content">
        <h1>Grow SSO test</h1>
        <p id="status">Checking sign-in…</p>

        <button id="sign-in" type="button" hidden>Sign in</button>
        <button id="sign-out" type="button" hidden>Sign out</button>
      </div>
    </header>

    <section class="content-block">
      <iframe
        id="grow-frame"
        title="Grow experience"
        src="about:blank"
        frameborder="0"
        scrolling="no"
        width="100%"
        height="600"
        allowtransparency="true"
        hidden>
      </iframe>
    </section>

    <script type="module">
      import Keycloak from "https://cdn.jsdelivr.net/npm/keycloak-js@26.2.4/+esm";

      // Change these only if you used different Keycloak names.
      const keycloak = new Keycloak({
        url: "http://localhost:8080",
        realm: "test",
        clientId: "GRZeta"
      });

      const growBaseUrl =
        "https://x.wayin.com/display/container/dc/fa1a1317-822c-4aa8-a790-cbbfa693a584?mode=adaptive&scrolling=no";

      const status = document.querySelector("#status");
      const signIn = document.querySelector("#sign-in");
      const signOut = document.querySelector("#sign-out");
      const growFrame = document.querySelector("#grow-frame");

      try {
        const signedIn = await keycloak.init({
          onLoad: "check-sso",
          pkceMethod: "S256"
        });

        if (signedIn) {
          // This must be a dedicated, non-sensitive Keycloak token claim.
          const customerId = keycloak.tokenParsed?.sub;

          if (!customerId) {
            status.textContent = "Signed in, but no customer ID is available.";
          } else {
            const growUrl = new URL(growBaseUrl);

            // This sends only the customer identifier, never a Keycloak token.
            growUrl.searchParams.set("nc.customerid", customerId);

            const username =
              keycloak.tokenParsed?.preferred_username ?? "user";

            status.textContent = `Signed in as ${username}. Loading Grow…`;
            signOut.hidden = false;
            growFrame.src = growUrl.toString();
            growFrame.hidden = false;
          }
        } else {
          status.textContent = "Please sign in to continue.";
          signIn.hidden = false;
        }
      } catch (error) {
        status.textContent = "Sign-in could not be checked.";
        signIn.hidden = false;
        console.error(error);
      }

      signIn.addEventListener("click", () => keycloak.login());
      signOut.addEventListener("click", () => keycloak.logout());
    </script>
  </body>
</html>
